name: Mobile and playable web

on:
  pull_request:
    paths: ['mobile/**', 'assets/**', 'data/config/modedex.yaml', 'data/config/modedex_learning_links.yaml', 'data/research/**', 'data/processed/modedex.json', 'scripts/build_modedex_learning.py', 'scripts/build_workbook_research_review.py', 'scripts/review_external_learning_references.py', 'scripts/build_game_art.py', 'scripts/build_web_runtime.py', 'scripts/signature_placements.py', 'scripts/fetch_signature_access.py', 'tests/test_modedex_learning*.py', 'tests/test_workbook_source_review.py', 'tests/test_game_art.py', 'tests/test_signature_placements.py', 'tests/test_web_runtime.py', 'tests/test_playtest_copy.py', 'requirements.txt', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_web_runtime.py
      - run: python -B scripts/build_modedex_learning.py
      - run: git diff --exit-code -- data mobile/web/src/data/runtime.json mobile/web/src/data/learning.json
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:playable
      - run: npm run test:playable
      - run: node --experimental-strip-types web/scripts/validate-quizzes.ts --write
      - run: git diff --exit-code -- web/quiz-audit.json
      - run: npx expo install --check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:playable:e2e
      - run: npm run build:playable
      - run: npx expo export --platform all --output-dir dist
