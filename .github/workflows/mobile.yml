name: Mobile and playable web

on:
  pull_request:
    paths: ['mobile/**', 'scripts/build_web_runtime.py', 'tests/test_web_runtime.py', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_web_runtime.py
      - run: git diff --exit-code -- data mobile/web/src/data/runtime.json
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:playable
      - run: npm run test:playable
      - run: npx expo install --check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:playable:e2e
      - run: npm run build:playable
      - run: npx expo export --platform all --output-dir dist
