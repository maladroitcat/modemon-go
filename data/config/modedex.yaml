version: 1

families:
  detector:
    name: Detector
    base_modemon_id: detector_base
    visual_family: eyeball_scanner
    core_job: Recognize or locate things
  anomaly:
    name: Anomaly Watcher
    base_modemon_id: anomaly_base
    visual_family: reptile
    core_job: Notice when something is unusually different
  forecast:
    name: Demand Forecaster
    base_modemon_id: forecast_base
    visual_family: ghost_spirit
    core_job: Predict what will be needed or happen next
  recommender:
    name: Recommender
    base_modemon_id: recommender_base
    visual_family: bird
    core_job: Select things likely to be useful or appealing
  extractor:
    name: Document Extractor
    base_modemon_id: extractor_base
    visual_family: small_rodent
    core_job: Pull useful structured information from documents
  scheduler:
    name: Scheduler
    base_modemon_id: scheduler_base
    visual_family: ocean_creature
    core_job: Allocate people, resources, routes, or time
  generator:
    name: Generator
    base_modemon_id: generator_base
    visual_family: cat
    core_job: Create new content from instructions or context
  retriever:
    name: Retriever
    base_modemon_id: retriever_base
    visual_family: dog
    core_job: Find existing information relevant to a request

modemon:
  detector_base:
    name: Seeklet
    family_id: detector
    stage: 1
    rarity: common
    evolves_from: null
    role: General Detector
    habitats:
      - healthcare
      - transportation
      - retail
      - food_hospitality
    ai_tasks:
      - image classification
      - object detection
      - image segmentation
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - YOLO
      - Faster R-CNN
      - U-Net
    input_data: Images and video frames
    output_data: Labels, object locations, segmentation masks, and confidence scores
    biases_limitations:
      - Performance can change with lighting
      - Occlusion can hide important visual information
      - Missing training examples can create blind spots
      - Models can learn visual shortcuts instead of meaningful features
      - False positives and false negatives are possible
    explainability:
      - saliency maps
      - Grad-CAM
      - occlusion testing
      - confidence inspection
    dex_entry: >-
      Seeklet spots things humans might otherwise have to find themselves. Its huge eyes turn
      pixels into patterns and patterns into guesses about what is there. Change the lighting,
      hide half an object, or show it something unlike its training data, though, and those
      impressive eyes can get impressively confused.
    signature: null

  detector_disease:
    name: Pathogaze
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Disease Detector
    habitats:
      - healthcare
    ai_tasks:
      - medical image classification
      - object detection
      - image segmentation
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - U-Net
      - Mask R-CNN
      - Faster R-CNN
    input_data: Medical images such as MRI scans, CT scans, X-rays, and pathology images
    output_data: Disease probabilities, object locations, or tissue segmentation masks
    biases_limitations:
      - Performance can vary across hospitals and scanners
      - Underrepresented demographic groups can experience worse performance
      - Subtle disease patterns can be difficult to detect
      - Models can learn shortcuts unrelated to disease
      - False negatives can be especially costly
    explainability:
      - saliency maps
      - Grad-CAM
      - segmentation overlays
      - subgroup sensitivity analysis
    dex_entry: >-
      Pathogaze turns Seeklet's eyesight toward medicine. Some versions answer "Does this scan
      look suspicious?" while others locate or precisely outline abnormal tissue. Those are
      different AI tasks, and in healthcare a confident-looking mistake is still a mistake,
      so clinicians, validation, and explanation matter.
    signature: null

  detector_pedestrian:
    name: Crowdseer
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Pedestrian Detector
    habitats:
      - transportation
    ai_tasks:
      - object detection
      - computer vision
    models_algorithms:
      - YOLO
      - Faster R-CNN
      - DETR
    input_data: Camera images and video frames from streets or transportation environments
    output_data: Pedestrian and vehicle locations, class labels, and confidence scores
    biases_limitations:
      - Darkness can reduce detection performance
      - Weather can obscure visual information
      - Occlusion can hide people or vehicles
      - Distance can make small objects difficult to detect
      - Unusual clothing or poses can be poorly represented in training data
    explainability:
      - bounding box inspection
      - confidence inspection
      - threshold analysis
      - error testing across environmental conditions
    dex_entry: >-
      Crowdseer doesn't just ask whether a person exists somewhere in an image. It has to find
      where they are. Rain, darkness, crowds, and the delivery truck blocking half the sidewalk
      all make that harder than your eyeballs would suggest.
    signature: null

  detector_defect:
    name: Inspectra
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Product or Defect Detector
    habitats:
      - retail
      - food_hospitality
    ai_tasks:
      - image classification
      - object detection
      - visual inspection
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - YOLO
      - visual anomaly detection model
    input_data: Images of products, shelves, food, or manufactured items
    output_data: Product categories, defect flags, object locations, or quality assessments
    biases_limitations:
      - New packaging can differ from training data
      - Subtle defects can be missed
      - Lighting changes can reduce performance
      - Poor training coverage can create blind spots
    explainability:
      - saliency maps
      - bounding box inspection
      - false positive review
      - false negative review
    dex_entry: >-
      Inspectra is the picky quality-control cousin. It can check products, shelves, components,
      or food for things that look wrong. Give it a night shift that looks nothing like its
      pristine training photos, though, and suddenly the expert inspector may be staring
      confidently at shadows.
    signature: null

  anomaly_base:
    name: Quirkle
    family_id: anomaly
    stage: 1
    rarity: common
    evolves_from: null
    role: General Anomaly Watcher
    habitats:
      - finance
      - healthcare
      - transportation
      - office_business
      - civic_government
    ai_tasks:
      - anomaly detection
    models_algorithms:
      - Isolation Forest
      - one-class SVM
      - autoencoder
      - variational autoencoder
      - statistical thresholding
    input_data: Historical examples of normal behavior and new observations
    output_data: Anomaly scores, alerts, or unusual-event flags
    biases_limitations:
      - Unusual behavior is not automatically harmful
      - Normal behavior changes over time
      - Rare legitimate cases can trigger alerts
      - Poor baselines can make anomaly scores misleading
    explainability:
      - anomaly score inspection
      - comparison with normal examples
      - feature contribution analysis
      - threshold inspection
    dex_entry: >-
      Quirkle's whole personality is "...that's weird." It learns what normal-ish behavior looks
      like and raises a tiny reptilian eyebrow when something wanders off-pattern. It doesn't
      necessarily know what happened or why. It only knows that this case deserves another look.
    signature: null

  anomaly_fraud:
    name: Swindlisk
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Fraud Watcher
    habitats:
      - finance
    ai_tasks:
      - anomaly detection
      - binary classification
      - risk scoring
    models_algorithms:
      - logistic regression
      - gradient boosted trees
      - random forest
      - Isolation Forest
      - graph neural network
      - neural network
    input_data: Transactions, account history, device information, location patterns, and customer behavior
    output_data: Fraud risk scores, suspicious-transaction flags, or review recommendations
    biases_limitations:
      - Fraud patterns change as attackers adapt
      - Legitimate unusual purchases can look suspicious
      - Historical labels can reflect uneven scrutiny
      - Fraud datasets are often highly imbalanced
    explainability:
      - SHAP
      - feature attribution
      - counterfactual explanation
      - threshold analysis
    dex_entry: >-
      Swindlisk hunts for transactions that don't smell right. A strange location, amount, or
      spending pattern might mean fraud, or it might mean you dared to go on vacation. Its job
      is usually to identify risk, not pronounce guilt.
    signature: null

  anomaly_vitals:
    name: Beatling
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Vital Watcher
    habitats:
      - healthcare
    ai_tasks:
      - time-series anomaly detection
    models_algorithms:
      - statistical thresholding
      - Isolation Forest
      - autoencoder
      - LSTM
      - time-series transformer
    input_data: Heart rate, oxygen saturation, temperature, blood pressure, and other vital signs over time
    output_data: Anomaly scores, physiological alerts, or unusual-trend flags
    biases_limitations:
      - Patient baselines differ
      - Sensors can be noisy
      - Too many alerts can cause alarm fatigue
      - Unusual measurements are not always dangerous
    explainability:
      - vital-sign trend plots
      - anomaly score inspection
      - time-window attribution
      - baseline comparison
    dex_entry: >-
      Beatling listens for the body getting out of rhythm. One unusual number may mean very
      little, so useful systems watch how measurements change over time and relative to context.
      Otherwise Beatling becomes the reptilian equivalent of a smoke detector screaming because
      you made toast.
    signature: null

  anomaly_machine:
    name: Geargoyle
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Machine Watcher
    habitats:
      - transportation
      - office_business
    ai_tasks:
      - anomaly detection
      - predictive maintenance
      - risk prediction
    models_algorithms:
      - autoencoder
      - Isolation Forest
      - gradient boosted trees
      - survival model
      - sequence model
    input_data: Vibration, temperature, pressure, equipment logs, and other machine sensor readings
    output_data: Abnormality scores, maintenance alerts, or failure-risk estimates
    biases_limitations:
      - Failures can be too rare to model well
      - Different machine types have different normal behavior
      - Operating conditions can shift over time
      - Sensor failures can look like machine failures
    explainability:
      - sensor trend inspection
      - feature attribution
      - reconstruction error
      - comparison with similar historical failures
    dex_entry: >-
      Geargoyle hears the mechanical version of "that noise wasn't there yesterday." Changes in
      vibration, heat, or other sensor patterns can reveal trouble before equipment fails
      dramatically. The trick is learning the difference between dangerous weird and perfectly
      normal weird.
    signature: null

  anomaly_network:
    name: Netnark
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Network Watcher
    habitats:
      - office_business
      - civic_government
    ai_tasks:
      - cybersecurity anomaly detection
    models_algorithms:
      - Isolation Forest
      - one-class SVM
      - autoencoder
      - sequence model
      - classifier
    input_data: Network traffic, login behavior, connection events, and system logs
    output_data: Anomaly scores, suspicious-event alerts, or threat-priority flags
    biases_limitations:
      - Legitimate users can behave unpredictably
      - Attackers adapt to detection systems
      - High false-positive rates can overwhelm analysts
      - Monitoring can create privacy concerns
    explainability:
      - feature attribution
      - event timeline inspection
      - baseline comparison
      - peer-activity comparison
    dex_entry: >-
      Netnark is a tiny digital snitch. Strange login times, odd traffic bursts, or unusual
      connections make it suspicious, but Steve working from Japan at 3 a.m. is not automatically
      a cyberattack. Good anomaly detection tells humans what deserves investigation.
    signature: null

  forecast_base:
    name: Forespirit
    family_id: forecast
    stage: 1
    rarity: common
    evolves_from: null
    role: General Demand Forecaster
    habitats:
      - healthcare
      - transportation
      - retail
      - entertainment
    ai_tasks:
      - forecasting
      - regression
    models_algorithms:
      - ARIMA
      - SARIMA
      - exponential smoothing
      - regression
      - gradient boosted trees
      - LSTM
      - time-series transformer
    input_data: Historical quantities, timestamps, seasonal patterns, and contextual variables
    output_data: Future quantity estimates, forecast ranges, or predicted demand
    biases_limitations:
      - Sudden shocks can invalidate historical patterns
      - Behavior can drift over time
      - Poor seasonality assumptions can distort forecasts
      - Data leakage can make evaluation unrealistically optimistic
    explainability:
      - forecast plots
      - residual analysis
      - feature effect analysis
      - prediction intervals
    dex_entry: >-
      Forespirit peers into the future by studying the past. Trends, seasons, and context help it
      estimate what comes next, but it is not actually psychic. Pandemics, storms, and Beyoncé
      concerts remain formidable enemies of the forecasting arts.
    signature: null

  forecast_patient:
    name: Wardwisp
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Patient Demand Forecaster
    habitats:
      - healthcare
    ai_tasks:
      - forecasting
      - count prediction
    models_algorithms:
      - ARIMA
      - count regression
      - gradient boosted trees
      - neural forecasting model
    input_data: Historical patient visits, seasonal patterns, calendar information, and local conditions
    output_data: Expected patient volume, bed demand, or service demand
    biases_limitations:
      - Outbreaks and emergencies are difficult to predict
      - Historical utilization can reflect unequal access to care
      - Operational changes can break historical relationships
    explainability:
      - forecast intervals
      - residual analysis
      - feature importance
      - subgroup error analysis
      - site-level error analysis
    dex_entry: >-
      Wardwisp tries to see a hospital rush before it arrives. Predicting patient volume can help
      prepare beds, staff, and supplies, but historical utilization also reflects who could and
      could not access care in the past.
    signature: null

  forecast_transit:
    name: Commutoracle
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Transit Forecaster
    habitats:
      - transportation
    ai_tasks:
      - time-series forecasting
      - spatiotemporal forecasting
    models_algorithms:
      - ARIMA
      - gradient boosted trees
      - LSTM
      - time-series transformer
      - spatiotemporal model
    input_data: Ridership, traffic, weather, calendar information, and route history
    output_data: Future ridership, traffic volume, or station demand
    biases_limitations:
      - Construction can rapidly change travel patterns
      - Special events can create unusual demand
      - Route changes can invalidate old patterns
      - Long-term travel behavior can drift
    explainability:
      - forecast versus actual comparison
      - spatial error maps
      - feature effect analysis
      - uncertainty intervals
    dex_entry: >-
      Commutoracle sees rush hour coming. It combines old travel patterns with things like time,
      weather, and events to estimate future movement. Then somebody closes a road for construction
      and its crystal ball develops a stress rash.
    signature: null

  forecast_stock:
    name: Coinjurer
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Stock or Inventory Forecaster
    habitats:
      - retail
    ai_tasks:
      - demand forecasting
      - inventory forecasting
    models_algorithms:
      - ARIMA
      - gradient boosted trees
      - regression
      - neural forecasting model
    input_data: Sales history, promotions, prices, seasonal patterns, and inventory levels
    output_data: Future units demanded or recommended inventory quantities
    biases_limitations:
      - New products have little historical data
      - Promotions can distort historical patterns
      - Previous stocking decisions can influence future training data
      - Sudden consumer trends can invalidate forecasts
    explainability:
      - forecast error by product
      - forecast error by store
      - feature effect analysis
      - prediction intervals
    dex_entry: >-
      Coinjurer predicts what the shelves will need before customers arrive. Too much stock wastes
      money and too little means empty shelves. The fun wrinkle is that yesterday's forecast changed
      yesterday's inventory, which can influence the data used for tomorrow's forecast.
    signature: null

  forecast_crowd:
    name: Gathergeist
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Crowd Forecaster
    habitats:
      - entertainment
    ai_tasks:
      - attendance forecasting
      - demand forecasting
    models_algorithms:
      - regression
      - gradient boosted trees
      - time-series model
    input_data: Ticket sales, historical attendance, calendar information, weather, and event characteristics
    output_data: Expected attendance or crowd volume
    biases_limitations:
      - Viral events can produce unexpected demand
      - Cancellations can invalidate predictions
      - Weather can change attendance abruptly
      - Human behavior can shift quickly
    explainability:
      - forecast ranges
      - feature effect analysis
      - residual analysis
      - historical error review
    dex_entry: >-
      Gathergeist senses an incoming swarm of humans. Venues can use forecasts to prepare staffing,
      food, and safety resources, but crowds remain gloriously capable of ignoring smooth
      mathematical curves.
    signature: null

  recommender_base:
    name: Suggestle
    family_id: recommender
    stage: 1
    rarity: common
    evolves_from: null
    role: General Recommender
    habitats:
      - retail
      - entertainment
      - education_research
      - food_hospitality
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - content-based filtering
      - matrix factorization
      - embedding model
      - ranking model
    input_data: User interactions, item information, preferences, and contextual signals
    output_data: Ranked personalized suggestions
    biases_limitations:
      - New users and items create cold-start problems
      - User feedback is often sparse
      - Popular items can dominate recommendations
      - Feedback loops can narrow exposure
      - Engagement is not the same as satisfaction
    explainability:
      - recommendation reason
      - exposure analysis
      - coverage analysis
      - subgroup fairness analysis
      - ranking audit
    dex_entry: >-
      Suggestle studies a giant pile of choices and chirps, "THIS ONE. YOU WANT THIS ONE."
      Recommendations can reduce overload beautifully, but repeatedly feeding people what they
      already clicked can turn personalization into a very comfortable little tunnel.
    signature: null

  recommender_product:
    name: Cartivore
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Product Recommender
    habitats:
      - retail
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - matrix factorization
      - content-based filtering
      - two-tower embedding model
    input_data: Product views, purchases, ratings, user behavior, and product metadata
    output_data: Ranked product recommendations
    biases_limitations:
      - Popularity can dominate recommendation lists
      - Sparse histories make personalization difficult
      - Purchases are imperfect signals of preference
      - Recommendations can reinforce past behavior
    explainability:
      - recommendation reason
      - diversity analysis
      - coverage analysis
      - exposure audit
    dex_entry: >-
      Cartivore collects shiny products and pushes the promising ones toward you. One innocent
      lamp purchase may convince it that lamps are now your defining personality trait, because
      behavioral data is useful but not clairvoyant.
    signature: null

  recommender_content:
    name: Reelure
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Content Recommender
    habitats:
      - entertainment
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - embedding model
      - sequence model
      - ranking model
    input_data: Viewing history, listening history, clicks, ratings, and content metadata
    output_data: Ranked recommendations for media, art, articles, or entertainment
    biases_limitations:
      - Feedback loops can narrow exposure
      - Popular content can crowd out niche content
      - Engagement optimization can conflict with user well-being
      - Repeated recommendations can create filter bubbles
    explainability:
      - recommendation reason
      - diversity analysis
      - novelty analysis
      - exposure audit
    dex_entry: >-
      Reelure uses flashy plumage to tempt you toward the next song, movie, or article. The
      important question isn't just whether it predicts another click. It is whether more
      engagement is actually the outcome we wanted.
    signature: null

  recommender_ai_curator:
    name: Muselect
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_content
    role: AI Curator
    habitats:
      - entertainment
      - education_research
    ai_tasks:
      - recommendation
      - information retrieval
      - ranking
      - text generation
    models_algorithms:
      - large language model
      - semantic representation
      - ranking model
    input_data: Machine-readable museum collection records and curatorial prompts
    output_data: Selected artworks, exhibition themes, interpretive text, and installation suggestions
    biases_limitations:
      - Generated information can be incorrect
      - Collection data can contain historical and cultural biases
      - Curatorial taste is subjective
      - The system has limited understanding of physical exhibition context
    explainability:
      - prompt inspection
      - source inspection
      - selection comparison
      - human curator review
    dex_entry: >-
      Muselect is Reelure with a museum key. Duke's Nasher Museum converted information about
      nearly 14,000 collection objects into machine-readable data for ChatGPT, which helped select
      artworks and create exhibition text and sequencing for an actual exhibition. The museum used
      the experiment to examine AI's usefulness and limitations in curatorial work.
    signature:
      anchor_name: Nasher Museum of Art
      anchor_scope: institution
      verified_use: AI-assisted exhibition curation
      documented_technology:
        - ChatGPT
      source_title: 'Act as if you are a curator'
      source_organization: Nasher Museum of Art
      source_url: https://nasher.duke.edu/exhibitions/act-as-if-you-are-a-curator-an-ai-generated-exhibition/

  recommender_learning:
    name: Curriquill
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Learning Recommender
    habitats:
      - education_research
    ai_tasks:
      - recommendation
      - personalization
      - ranking
    models_algorithms:
      - content-based recommendation
      - embedding model
      - ranking model
      - knowledge tracing
      - learner model
    input_data: Learner history, performance, interests, activity, and available learning resources
    output_data: Ranked learning resources or recommended next activities
    biases_limitations:
      - Performance is not the same as understanding
      - Learner state is only partially observable
      - Personalization can narrow exploration
      - Historical learning data can reflect unequal opportunity
    explainability:
      - recommendation reason
      - learning gain evaluation
      - subgroup performance analysis
      - resource diversity analysis
    dex_entry: >-
      Curriquill wants to know what would help you learn next. It may offer another practice
      problem, a reading, or a different explanation, but students have motivations and
      misunderstandings that don't fit neatly into click histories.
    signature: null

  recommender_adaptive_learning:
    name: Mentamorph
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_learning
    role: Adaptive Learning Guide
    habitats:
      - education_research
    ai_tasks:
      - adaptive learning
      - personalization
      - recommendation
      - text generation
    models_algorithms:
      - large language model
      - personalization model
      - recommendation model
    input_data: Individual and group gameplay activity, learner responses, and learning context
    output_data: Tailored feedback and responsive adaptations to the learning experience
    biases_limitations:
      - Language models can produce incorrect feedback
      - Learner models are incomplete representations of understanding
      - Over-personalization can limit productive challenge
      - Teacher oversight remains important
    explainability:
      - feedback comparison with learner evidence
      - teacher review
      - learning outcome evaluation
      - failure-case analysis
    dex_entry: >-
      Mentamorph changes its feathers as the learner changes. In EcoJourneys, the Friday Institute
      and collaborators added language-model capability that evaluates individual and group activity
      and provides tailored feedback during a science problem-solving game. That's personalized AI
      responding while learning is happening, not merely recommending the next video.
    signature:
      anchor_name: Friday Institute
      anchor_scope: research_project
      verified_use: Adaptive feedback in the EcoJourneys learning game
      documented_technology:
        - large language model
      source_title: 'Friday Institute, Center for Educational Informatics and EngageAI Institute Collaborate to Advance AI in Education'
      source_organization: Friday Institute for Educational Innovation
      source_url: https://fi.ncsu.edu/news/friday-institute-center-for-educational-informatics-and-engageai-institute-collaborate-to-advance-ai-in-education/

  recommender_research:
    name: Referaptor
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_learning
    role: Research Recommender
    habitats:
      - education_research
    ai_tasks:
      - recommendation
      - semantic similarity
      - ranking
    models_algorithms:
      - semantic embedding model
      - similarity search
      - ranking model
    input_data: User writing, thesis statements, outlines, or research topics
    output_data: Recommended academic publications
    biases_limitations:
      - Corpus coverage limits what can be recommended
      - Citation and popularity patterns can shape results
      - Semantic matching can misunderstand user intent
      - A recommendation is not evidence that a source is trustworthy
    explainability:
      - query-to-source match inspection
      - source relevance review
      - coverage analysis
      - diversity analysis
    dex_entry: >-
      Referaptor swoops in carrying papers you didn't know you needed. NC State Libraries offers
      Keenious, an AI tool that analyzes writing or a text sample and recommends relevant scholarly
      publications. It can uncover literature beyond obvious keywords, but you still have to decide
      whether the papers are good evidence.
    signature:
      anchor_name: NC State University Libraries
      anchor_scope: library_system
      verified_use: AI-assisted scholarly publication recommendation
      documented_technology:
        - Keenious
      source_title: 'Keenious Research Explorer'
      source_organization: NC State University Libraries
      source_url: https://www.lib.ncsu.edu/databases/keenious-research-explorer/guide

  recommender_menu:
    name: Nibblet
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Menu Recommender
    habitats:
      - food_hospitality
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - content-based filtering
      - collaborative filtering
      - ranking model
      - rule-based constraint system
    input_data: Past orders, stated preferences, dietary constraints, menu items, and current context
    output_data: Ranked dish or service recommendations
    biases_limitations:
      - Sparse history limits personalization
      - Preferences change with context
      - Popularity can dominate suggestions
      - Allergies and medical restrictions cannot be treated as probabilistic guesses
    explainability:
      - recommendation reason
      - constraint validation
      - diversity analysis
