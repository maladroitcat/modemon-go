version: 1

families:
  detector:
    name: Detector
    base_modemon_id: detector_base
    visual_family: eyeball_scanner
    core_job: Recognize or locate things
  anomaly:
    name: Anomaly Watcher
    base_modemon_id: anomaly_base
    visual_family: reptile
    core_job: Notice when something is unusually different
  forecast:
    name: Demand Forecaster
    base_modemon_id: forecast_base
    visual_family: ghost_spirit
    core_job: Predict what will be needed or happen next
  recommender:
    name: Recommender
    base_modemon_id: recommender_base
    visual_family: bird
    core_job: Select things likely to be useful or appealing
  extractor:
    name: Document Extractor
    base_modemon_id: extractor_base
    visual_family: small_rodent
    core_job: Pull useful structured information from documents
  scheduler:
    name: Scheduler
    base_modemon_id: scheduler_base
    visual_family: ocean_creature
    core_job: Allocate people, resources, routes, or time
  generator:
    name: Generator
    base_modemon_id: generator_base
    visual_family: cat
    core_job: Create new content from instructions or context
  retriever:
    name: Retriever
    base_modemon_id: retriever_base
    visual_family: dog
    core_job: Find existing information relevant to a request

modemon:
  detector_base:
    name: Seeklet
    family_id: detector
    stage: 1
    rarity: common
    evolves_from: null
    role: General Detector
    habitats:
      - healthcare
      - transportation
      - retail
      - food_hospitality
    ai_tasks:
      - image classification
      - object detection
      - image segmentation
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - YOLO
      - Faster R-CNN
      - U-Net
    input_data: Images and video frames
    output_data: Labels, object locations, segmentation masks, and confidence scores
    biases_limitations:
      - Performance can change with lighting
      - Occlusion can hide important visual information
      - Missing training examples can create blind spots
      - Models can learn visual shortcuts instead of meaningful features
      - False positives and false negatives are possible
    explainability:
      - saliency maps
      - Grad-CAM
      - occlusion testing
      - confidence inspection
    dex_entry: >-
      Seeklet represents image recognition and object detection: AI that learns from
      pictures to name what it sees and point out where things are. Its huge eyes can
      help spot a person, a product, or a damaged item. But dim lighting, hidden objects,
      and unfamiliar scenes can leave this eager spotter confidently confused.
    signature: null

  detector_disease:
    name: Pathogaze
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Disease Detector
    habitats:
      - healthcare
    ai_tasks:
      - medical image classification
      - object detection
      - image segmentation
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - U-Net
      - Mask R-CNN
      - Faster R-CNN
    input_data: Medical images such as MRI scans, CT scans, X-rays, and pathology images
    output_data: Disease probabilities, object locations, or tissue segmentation masks
    biases_limitations:
      - Performance can vary across hospitals and scanners
      - Underrepresented demographic groups can experience worse performance
      - Subtle disease patterns can be difficult to detect
      - Models can learn shortcuts unrelated to disease
      - False negatives can be especially costly
    explainability:
      - saliency maps
      - Grad-CAM
      - segmentation overlays
      - subgroup sensitivity analysis
    dex_entry: >-
      Pathogaze represents AI that checks medical images for signs of disease. It might
      flag a suspicious scan, point to an unusual patch, or outline tissue for a
      clinician to inspect. Its careful gaze is a helper, not a diagnosis: different
      scanners and missing examples can lead to mistakes, so medical experts must check
      its findings.
    signature: null

  detector_pedestrian:
    name: Crowdseer
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Pedestrian Detector
    habitats:
      - transportation
    ai_tasks:
      - object detection
      - computer vision
    models_algorithms:
      - YOLO
      - Faster R-CNN
      - DETR
    input_data: Camera images and video frames from streets or transportation environments
    output_data: Pedestrian and vehicle locations, class labels, and confidence scores
    biases_limitations:
      - Darkness can reduce detection performance
      - Weather can obscure visual information
      - Occlusion can hide people or vehicles
      - Distance can make small objects difficult to detect
      - Unusual clothing or poses can be poorly represented in training data
    explainability:
      - bounding box inspection
      - confidence inspection
      - threshold analysis
      - error testing across environmental conditions
    dex_entry: >-
      Crowdseer represents pedestrian detection: AI that finds people in street images
      and video, not just whether someone is in the picture. This many-eyed lookout
      points out where people are so a transport system can respond. Darkness, rain,
      crowds, and a delivery truck hiding half the sidewalk can all make its watch less
      reliable.
    signature: null

  detector_defect:
    name: Inspectra
    family_id: detector
    stage: 2
    rarity: rare
    evolves_from: detector_base
    role: Product or Defect Detector
    habitats:
      - retail
      - food_hospitality
    ai_tasks:
      - image classification
      - object detection
      - visual inspection
    models_algorithms:
      - convolutional neural network
      - vision transformer
      - YOLO
      - visual anomaly detection model
    input_data: Images of products, shelves, food, or manufactured items
    output_data: Product categories, defect flags, object locations, or quality assessments
    biases_limitations:
      - New packaging can differ from training data
      - Subtle defects can be missed
      - Lighting changes can reduce performance
      - Poor training coverage can create blind spots
    explainability:
      - saliency maps
      - bounding box inspection
      - false positive review
      - false negative review
    dex_entry: >-
      Inspectra represents AI visual inspection, which checks pictures of products, food,
      or parts for damage and other visible problems. This fussy inspector might spot a
      cracked item or misplaced label before it reaches a customer. But new packaging and
      unfamiliar lighting can fool it into missing a flaw or treating a harmless shadow
      as trouble.
    signature: null

  anomaly_base:
    name: Quirkle
    family_id: anomaly
    stage: 1
    rarity: common
    evolves_from: null
    role: General Anomaly Watcher
    habitats:
      - finance
      - healthcare
      - transportation
      - office_business
      - civic_government
    ai_tasks:
      - anomaly detection
    models_algorithms:
      - Isolation Forest
      - one-class SVM
      - autoencoder
      - variational autoencoder
      - statistical thresholding
    input_data: Historical examples of normal behavior and new observations
    output_data: Anomaly scores, alerts, or unusual-event flags
    biases_limitations:
      - Unusual behavior is not automatically harmful
      - Normal behavior changes over time
      - Rare legitimate cases can trigger alerts
      - Poor baselines can make anomaly scores misleading
    explainability:
      - anomaly score inspection
      - comparison with normal examples
      - feature contribution analysis
      - threshold inspection
    dex_entry: >-
      Quirkle represents anomaly detection: AI that learns usual patterns and flags
      things that look unusually different. Its tiny reptilian eyebrow rises at a strange
      payment, reading, or connection. A flag means "take another look," not "something
      bad definitely happened." Even perfectly ordinary changes can surprise a watcher
      that has never seen them before.
    signature: null

  anomaly_fraud:
    name: Swindlisk
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Fraud Watcher
    habitats:
      - finance
    ai_tasks:
      - anomaly detection
      - binary classification
      - risk scoring
    models_algorithms:
      - logistic regression
      - gradient boosted trees
      - random forest
      - Isolation Forest
      - graph neural network
      - neural network
    input_data: Transactions, account history, device information, location patterns, and customer behavior
    output_data: Fraud risk scores, suspicious-transaction flags, or review recommendations
    biases_limitations:
      - Fraud patterns change as attackers adapt
      - Legitimate unusual purchases can look suspicious
      - Historical labels can reflect uneven scrutiny
      - Fraud datasets are often highly imbalanced
    explainability:
      - SHAP
      - feature attribution
      - counterfactual explanation
      - threshold analysis
    dex_entry: >-
      Swindlisk represents AI fraud monitoring, which looks for unusual payments and
      spending patterns that may need investigation. Its suspicious snout might notice an
      unfamiliar location or a much larger purchase than usual. But a holiday shopping
      spree is not proof of crime: people must check the warning before treating an
      innocent customer as a fraudster.
    signature: null

  anomaly_vitals:
    name: Beatling
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Vital Watcher
    habitats:
      - healthcare
    ai_tasks:
      - time-series anomaly detection
    models_algorithms:
      - statistical thresholding
      - Isolation Forest
      - autoencoder
      - LSTM
      - time-series transformer
    input_data: Heart rate, oxygen saturation, temperature, blood pressure, and other vital signs over time
    output_data: Anomaly scores, physiological alerts, or unusual-trend flags
    biases_limitations:
      - Patient baselines differ
      - Sensors can be noisy
      - Too many alerts can cause alarm fatigue
      - Unusual measurements are not always dangerous
    explainability:
      - vital-sign trend plots
      - anomaly score inspection
      - time-window attribution
      - baseline comparison
    dex_entry: >-
      Beatling represents AI that watches body measurements, such as heart rate, for
      unusual changes over time. This little rhythm keeper can flag a pattern that
      deserves medical attention. One odd reading may also come from exercise or a loose
      sensor, so its alerts need context and clinical review rather than a jump to
      conclusions.
    signature: null

  anomaly_machine:
    name: Geargoyle
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Machine Watcher
    habitats:
      - transportation
      - office_business
    ai_tasks:
      - anomaly detection
      - predictive maintenance
      - risk prediction
    models_algorithms:
      - autoencoder
      - Isolation Forest
      - gradient boosted trees
      - survival model
      - sequence model
    input_data: Vibration, temperature, pressure, equipment logs, and other machine sensor readings
    output_data: Abnormality scores, maintenance alerts, or failure-risk estimates
    biases_limitations:
      - Failures can be too rare to model well
      - Different machine types have different normal behavior
      - Operating conditions can shift over time
      - Sensor failures can look like machine failures
    explainability:
      - sensor trend inspection
      - feature attribution
      - reconstruction error
      - comparison with similar historical failures
    dex_entry: >-
      Geargoyle represents AI equipment monitoring, which learns patterns in heat,
      vibration, and other measurements to notice possible trouble. Its stony ears perk
      up at the mechanical version of "that noise wasn't there yesterday." A warning can
      help people investigate before a breakdown, but a normal change in workload can
      sound suspicious too.
    signature: null

  anomaly_network:
    name: Netnark
    family_id: anomaly
    stage: 2
    rarity: rare
    evolves_from: anomaly_base
    role: Network Watcher
    habitats:
      - office_business
      - civic_government
    ai_tasks:
      - cybersecurity anomaly detection
    models_algorithms:
      - Isolation Forest
      - one-class SVM
      - autoencoder
      - sequence model
      - classifier
    input_data: Network traffic, login behavior, connection events, and system logs
    output_data: Anomaly scores, suspicious-event alerts, or threat-priority flags
    biases_limitations:
      - Legitimate users can behave unpredictably
      - Attackers adapt to detection systems
      - High false-positive rates can overwhelm analysts
      - Monitoring can create privacy concerns
    explainability:
      - feature attribution
      - event timeline inspection
      - baseline comparison
      - peer-activity comparison
    dex_entry: >-
      Netnark represents AI network monitoring, which checks computer connections and
      activity for unusual behavior. This digital lookout may flag a burst of traffic or
      a login at an unexpected hour for a security team to investigate. But someone
      working abroad is not automatically an attacker; an unusual pattern is a clue, not
      a verdict.
    signature: null

  forecast_base:
    name: Forespirit
    family_id: forecast
    stage: 1
    rarity: common
    evolves_from: null
    role: General Demand Forecaster
    habitats:
      - healthcare
      - transportation
      - retail
      - entertainment
    ai_tasks:
      - forecasting
      - regression
    models_algorithms:
      - ARIMA
      - SARIMA
      - exponential smoothing
      - regression
      - gradient boosted trees
      - LSTM
      - time-series transformer
    input_data: Historical quantities, timestamps, seasonal patterns, and contextual variables
    output_data: Future quantity estimates, forecast ranges, or predicted demand
    biases_limitations:
      - Sudden shocks can invalidate historical patterns
      - Behavior can drift over time
      - Poor seasonality assumptions can distort forecasts
      - Data leakage can make evaluation unrealistically optimistic
    explainability:
      - forecast plots
      - residual analysis
      - feature effect analysis
      - prediction intervals
    dex_entry: >-
      Forespirit represents demand forecasting: AI that studies past patterns and clues
      such as weather or seasons to estimate what will be needed next. Its misty crystal
      ball might help plan stock, staffing, or transport. It is not actually psychic: a
      storm or an unexpected Beyoncé concert can upset its predictions.
    signature: null

  forecast_patient:
    name: Wardwisp
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Patient Demand Forecaster
    habitats:
      - healthcare
    ai_tasks:
      - forecasting
      - count prediction
    models_algorithms:
      - ARIMA
      - count regression
      - gradient boosted trees
      - neural forecasting model
    input_data: Historical patient visits, seasonal patterns, calendar information, and local conditions
    output_data: Expected patient volume, bed demand, or service demand
    biases_limitations:
      - Outbreaks and emergencies are difficult to predict
      - Historical utilization can reflect unequal access to care
      - Operational changes can break historical relationships
    explainability:
      - forecast intervals
      - residual analysis
      - feature importance
      - subgroup error analysis
      - site-level error analysis
    dex_entry: >-
      Wardwisp represents AI patient-demand forecasting, which estimates how many people
      may need hospital care in the coming hours or days. This watchful spirit helps
      planners prepare beds, staff, and supplies before a rush. But past visits reflect
      who could get care as well as who needed it, so predictions can carry old gaps
      forward.
    signature: null

  forecast_transit:
    name: Commutoracle
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Transit Forecaster
    habitats:
      - transportation
    ai_tasks:
      - time-series forecasting
      - spatiotemporal forecasting
    models_algorithms:
      - ARIMA
      - gradient boosted trees
      - LSTM
      - time-series transformer
      - spatiotemporal model
    input_data: Ridership, traffic, weather, calendar information, and route history
    output_data: Future ridership, traffic volume, or station demand
    biases_limitations:
      - Construction can rapidly change travel patterns
      - Special events can create unusual demand
      - Route changes can invalidate old patterns
      - Long-term travel behavior can drift
    explainability:
      - forecast versus actual comparison
      - spatial error maps
      - feature effect analysis
      - uncertainty intervals
    dex_entry: >-
      Commutoracle represents AI transit forecasting, which estimates future journeys or
      passenger demand from travel history, time, weather, and events. Its ghostly
      timetable helps planners see a possible rush coming. Then a road closes or travel
      habits change, and its crystal ball needs a rethink: a forecast is a guide, not a
      promise.
    signature: null

  forecast_stock:
    name: Coinjurer
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Stock or Inventory Forecaster
    habitats:
      - retail
    ai_tasks:
      - demand forecasting
      - inventory forecasting
    models_algorithms:
      - ARIMA
      - gradient boosted trees
      - regression
      - neural forecasting model
    input_data: Sales history, promotions, prices, seasonal patterns, and inventory levels
    output_data: Future units demanded or recommended inventory quantities
    biases_limitations:
      - New products have little historical data
      - Promotions can distort historical patterns
      - Previous stocking decisions can influence future training data
      - Sudden consumer trends can invalidate forecasts
    explainability:
      - forecast error by product
      - forecast error by store
      - feature effect analysis
      - prediction intervals
    dex_entry: >-
      Coinjurer represents AI inventory forecasting, which estimates how much of a
      product a shop may need and when. This shelf-haunting spirit tries to avoid both
      empty displays and piles of unwanted stock. But an empty shelf can hide real
      demand: yesterday's sales do not count the customers who wanted something that was
      already sold out.
    signature: null

  forecast_crowd:
    name: Gathergeist
    family_id: forecast
    stage: 2
    rarity: rare
    evolves_from: forecast_base
    role: Crowd Forecaster
    habitats:
      - entertainment
    ai_tasks:
      - attendance forecasting
      - demand forecasting
    models_algorithms:
      - regression
      - gradient boosted trees
      - time-series model
    input_data: Ticket sales, historical attendance, calendar information, weather, and event characteristics
    output_data: Expected attendance or crowd volume
    biases_limitations:
      - Viral events can produce unexpected demand
      - Cancellations can invalidate predictions
      - Weather can change attendance abruptly
      - Human behavior can shift quickly
    explainability:
      - forecast ranges
      - feature effect analysis
      - residual analysis
      - historical error review
    dex_entry: >-
      Gathergeist represents AI crowd forecasting, which estimates how many people may
      arrive at a place or event. This sociable spirit senses a possible swarm so venues
      can prepare staff, food, and safety resources. Unexpected events and changing plans
      can still catch it out; crowds do not have to follow a tidy prediction.
    signature: null

  recommender_base:
    name: Suggestle
    family_id: recommender
    stage: 1
    rarity: common
    evolves_from: null
    role: General Recommender
    habitats:
      - retail
      - entertainment
      - education_research
      - food_hospitality
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - content-based filtering
      - matrix factorization
      - embedding model
      - ranking model
    input_data: User interactions, item information, preferences, and contextual signals
    output_data: Ranked personalized suggestions
    biases_limitations:
      - New users and items create cold-start problems
      - User feedback is often sparse
      - Popular items can dominate recommendations
      - Feedback loops can narrow exposure
      - Engagement is not the same as satisfaction
    explainability:
      - recommendation reason
      - exposure analysis
      - coverage analysis
      - subgroup fairness analysis
      - ranking audit
    dex_entry: >-
      Suggestle represents recommendation systems: AI that sorts many choices to suggest
      things a person may find useful or appealing. This excitable bird chirps, "Try this
      one!" after studying clues such as earlier choices or similar interests. Helpful
      suggestions can reduce overload, but always offering familiar options can narrow
      what someone gets to discover.
    signature: null

  recommender_product:
    name: Cartivore
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Product Recommender
    habitats:
      - retail
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - matrix factorization
      - content-based filtering
      - two-tower embedding model
    input_data: Product views, purchases, ratings, user behavior, and product metadata
    output_data: Ranked product recommendations
    biases_limitations:
      - Popularity can dominate recommendation lists
      - Sparse histories make personalization difficult
      - Purchases are imperfect signals of preference
      - Recommendations can reinforce past behavior
    explainability:
      - recommendation reason
      - diversity analysis
      - coverage analysis
      - exposure audit
    dex_entry: >-
      Cartivore represents AI product recommendations, which use shopping clues to
      suggest items someone might like. This collector of shiny bargains may offer a
      useful accessory or a similar product from a huge catalog. But one lamp purchase
      does not make lamps your whole personality: past behavior is an imperfect guide to
      what you want now.
    signature: null

  recommender_content:
    name: Reelure
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Content Recommender
    habitats:
      - entertainment
    ai_tasks:
      - recommendation
      - ranking
    models_algorithms:
      - collaborative filtering
      - embedding model
      - sequence model
      - ranking model
    input_data: Viewing history, listening history, clicks, ratings, and content metadata
    output_data: Ranked recommendations for media, art, articles, or entertainment
    biases_limitations:
      - Feedback loops can narrow exposure
      - Popular content can crowd out niche content
      - Engagement optimization can conflict with user well-being
      - Repeated recommendations can create filter bubbles
    explainability:
      - recommendation reason
      - diversity analysis
      - novelty analysis
      - exposure audit
    dex_entry: >-
      Reelure represents AI content recommendations, which suggest songs, films,
      articles, or other media based on signs of interest. Its flashy feathers tempt you
      toward the next discovery. Predicting another click is not the same as choosing
      something worthwhile, though; what keeps a person watching may not be what they
      actually value.
    signature: null

  recommender_ai_curator:
    name: Muselect
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_content
    role: AI Curator
    habitats:
      - entertainment
      - education_research
    ai_tasks:
      - recommendation
      - information retrieval
      - ranking
      - text generation
    models_algorithms:
      - large language model
      - semantic representation
      - ranking model
    input_data: Machine-readable museum collection records and curatorial prompts
    output_data: Selected artworks, exhibition themes, interpretive text, and installation suggestions
    biases_limitations:
      - Generated information can be incorrect
      - Collection data can contain historical and cultural biases
      - Curatorial taste is subjective
      - The system has limited understanding of physical exhibition context
    explainability:
      - prompt inspection
      - source inspection
      - selection comparison
      - human curator review
    dex_entry: >-
      Muselect represents AI-assisted art curation: software that helps choose artworks
      and arrange an exhibition. At Duke's Nasher Museum of Art, ChatGPT helped select
      works and draft exhibition text from collection information in a curatorial
      experiment. This discerning bird can suggest surprising connections, but museum
      staff still need to check facts, context, and what the selection leaves out.
    signature:
      anchor_name: Nasher Museum of Art
      anchor_scope: institution
      verified_use: AI-assisted exhibition curation
      documented_technology:
        - ChatGPT
      source_title: 'Act as if you are a curator'
      source_organization: Nasher Museum of Art
      source_url: https://nasher.duke.edu/exhibitions/act-as-if-you-are-a-curator-an-ai-generated-exhibition/

  recommender_learning:
    name: Curriquill
    family_id: recommender
    stage: 2
    rarity: rare
    evolves_from: recommender_base
    role: Learning Recommender
    habitats:
      - education_research
    ai_tasks:
      - recommendation
      - personalization
      - ranking
    models_algorithms:
      - content-based recommendation
      - embedding model
      - ranking model
      - knowledge tracing
      - learner model
    input_data: Learner history, performance, interests, activity, and available learning resources
    output_data: Ranked learning resources or recommended next activities
    biases_limitations:
      - Performance is not the same as understanding
      - Learner state is only partially observable
      - Personalization can narrow exploration
      - Historical learning data can reflect unequal opportunity
    explainability:
      - recommendation reason
      - learning gain evaluation
      - subgroup performance analysis
      - resource diversity analysis
    dex_entry: >-
      Curriquill represents AI learning recommendations, which suggest a practice
      problem, reading, or explanation that might help a student next. This thoughtful
      bird watches for clues about progress before offering another branch to explore.
      But a click or a wrong answer cannot reveal everything about a learner's needs,
      motivation, or understanding.
    signature: null

  recommender_adaptive_learning:
    name: Mentamorph
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_learning
    role: Adaptive Learning Guide
    habitats:
      - education_research
    ai_tasks:
      - adaptive learning
      - personalization
      - recommendation
      - text generation
    models_algorithms:
      - large language model
      - personalization model
      - recommendation model
    input_data: Individual and group gameplay activity, learner responses, and learning context
    output_data: Tailored feedback and responsive adaptations to the learning experience
    biases_limitations:
      - Language models can produce incorrect feedback
      - Learner models are incomplete representations of understanding
      - Over-personalization can limit productive challenge
      - Teacher oversight remains important
    explainability:
      - feedback comparison with learner evidence
      - teacher review
      - learning outcome evaluation
      - failure-case analysis
    dex_entry: >-
      Mentamorph represents an AI learning guide that uses students' activity to offer
      feedback as they work. In the Friday Institute's EcoJourneys science game, AI
      software helps provide tailored feedback for individuals and groups. This
      feather-changing guide tries to keep pace with learning, but its view of a
      student's understanding is incomplete and its advice needs checking.
    signature:
      anchor_name: Friday Institute
      anchor_scope: research_project
      verified_use: Adaptive feedback in the EcoJourneys learning game
      documented_technology:
        - large language model
      source_title: 'Friday Institute, Center for Educational Informatics and EngageAI Institute Collaborate to Advance AI in Education'
      source_organization: Friday Institute for Educational Innovation
      source_url: https://fi.ncsu.edu/news/friday-institute-center-for-educational-informatics-and-engageai-institute-collaborate-to-advance-ai-in-education/

  recommender_research:
    name: Referaptor
    family_id: recommender
    stage: 3
    rarity: signature
    evolves_from: recommender_learning
    role: Research Recommender
    habitats:
      - education_research
    ai_tasks:
      - recommendation
      - semantic similarity
      - ranking
    models_algorithms:
      - semantic embedding model
      - similarity search
      - ranking model
    input_data: User writing, thesis statements, outlines, or research topics
    output_data: Recommended academic publications
    biases_limitations:
      - Corpus coverage limits what can be recommended
      - Citation and popularity patterns can shape results
      - Semantic matching can misunderstand user intent
      - A recommendation is not evidence that a source is trustworthy
    explainability:
      - query-to-source match inspection
      - source relevance review
      - coverage analysis
      - diversity analysis
    dex_entry: >-
      Referaptor represents AI research recommendations, which suggest scholarly papers
      related to a piece of writing. North Carolina State University Libraries offers
