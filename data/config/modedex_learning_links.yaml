# Keys are canonical semantic species IDs, never creature-name-derived IDs.
# Every optional secondary has a separate educational purpose, not filler.
species:
  detector_base:
    name: Seeklet
    primary_lesson: detection
    confidence: high
    match_scope: task
    rationale: Introduces finding objects, locating them, and reporting confidence, directly matching Seeklet's image-to-detections job.
    limitations: Not an exhaustive survey of every representative detector architecture.
    review_required: false
  detector_disease:
    name: Pathogaze
    primary_lesson: unet
    secondary_lesson: gradcam
    secondary_rationale: Explains regional evidence heatmaps for CNN predictions, distinct from learning how segmentation works.
    confidence: high
    match_scope: representative_technique
    rationale: U-Net is explicitly canonical and the lesson teaches biomedical pixel-level segmentation.
    limitations: Does not establish clinical safety or a diagnosis; Grad-CAM is not validation of every architecture listed in canon.
    review_required: false
  detector_pedestrian:
    name: Crowdseer
    primary_lesson: yolo
    confidence: high
    match_scope: representative_technique
    rationale: Teaches two canonically listed detectors and their localization and speed trade-offs for detecting people in frames.
    limitations: Does not teach pedestrian tracking or establish any real installation.
    review_required: false
  detector_defect:
    name: Inspectra
    primary_lesson: yolo
    secondary_lesson: gradcam
    secondary_rationale: Adds inspection of CNN image evidence rather than another detection tutorial.
    confidence: high
    match_scope: representative_technique
    rationale: YOLO is a canonical representative model for finding visible defects; the lesson covers object localization.
    limitations: Uses general object-detection examples, not industrial defect validation or all anomaly-based methods.
    review_required: false
  anomaly_base:
    name: Quirkle
    primary_lesson: outliers
    confidence: high
    match_scope: task
    rationale: Accessible introduction to unusual observations and statistical thresholds, including why an unusual point is not necessarily an error.
    limitations: Does not teach Isolation Forest or one-class SVM; covers the canonical statistical-thresholding option.
    review_required: false
  anomaly_fraud:
    name: Swindlisk
    primary_lesson: logistic
    secondary_lesson: shap
    secondary_rationale: Separately teaches feature attribution for explaining an individual risk score.
    confidence: high
    match_scope: representative_technique
    rationale: Logistic regression is a canonical fraud-classification technique; the lesson explains probability and decision thresholds.
    limitations: Educational examples are not a fraud system, and neither probabilities nor SHAP establish wrongdoing.
    review_required: false
  anomaly_vitals:
    name: Beatling
    primary_lesson: outliers
    secondary_lesson: time_features
    secondary_rationale: Adds temporal windows and signal features needed to interpret changing vital measurements.
    confidence: high
    match_scope: representative_technique
    rationale: Statistical thresholding directly matches Beatling's monitoring role, including distinguishing unusual readings from measurement problems.
    limitations: Not medical guidance, clinical alert validation, or a lesson on every listed sequence model.
    review_required: false
  anomaly_machine:
    name: Geargoyle
    primary_lesson: autoencoders
    secondary_lesson: time_features
    secondary_rationale: Explains vibration and temporal signal features independently of the reconstruction model.
    confidence: medium
    match_scope: representative_technique
    scope_label: Autoencoder reconstruction component, not a complete maintenance-alert system
    rationale: Canon lists autoencoders; the lesson explains compression, reconstruction, and reconstruction error useful for understanding this option.
    limitations: Does not teach an anomaly threshold, predictive maintenance, or remaining-life estimation; framing is generative modeling.
    review_required: true
  anomaly_network:
    name: Netnark
    primary_lesson: autoencoders
    secondary_lesson: outliers
    secondary_rationale: Adds the distinct distinction between unusual observations, measurement errors, and genuine incidents.
    confidence: medium
    match_scope: representative_technique
    scope_label: Autoencoder model component, not a network-intrusion tutorial
    rationale: Autoencoders are explicitly canonical; compression, reconstruction, and reconstruction error explain a genuine model component rather than a vague security analogy.
    limitations: Does not teach network features or alert thresholds, establish malicious activity, or identify an installed security model.
    review_required: true
  forecast_base:
    name: Forespirit
    primary_lesson: time_series
    confidence: high
    match_scope: input_representation
    rationale: Introduces ordered measurements and sampling, the essential input foundation for learning demand from historical observations.
    limitations: An introductory foundation, not an ARIMA or forecasting-model tutorial.
    review_required: false
  forecast_patient:
    name: Wardwisp
    primary_lesson: time_features
    confidence: high
    match_scope: input_representation
    rationale: Calendar, lag, and rolling features explain how past patient counts and recurring demand patterns become model inputs.
    limitations: Does not teach count regression, hospital allocation, or clinical decision-making.
    review_required: false
  forecast_transit:
    name: Commutoracle
    primary_lesson: time_features
    secondary_lesson: lstm
    secondary_rationale: Explains memory and gates in the explicitly listed LSTM model, beyond creating temporal input features.
    confidence: high
    match_scope: input_representation
    rationale: Lag and seasonal features connect historical ridership to the transit forecasting task.
    limitations: LSTM lesson uses NLP framing; it is a representative architecture explanation, not a transit deployment claim.
    review_required: false
  forecast_stock:
    name: Coinjurer
    primary_lesson: time_features
    confidence: high
    match_scope: input_representation
    rationale: Lagged sales and seasonal features directly support understanding inventory-demand forecasting inputs.
    limitations: Does not teach stock-market trading or all listed forecasting algorithms.
    review_required: false
  forecast_crowd:
    name: Gathergeist
    primary_lesson: time_features
    confidence: high
    match_scope: input_representation
    rationale: Recurring calendar patterns and recent-count windows are useful inputs for crowd-demand prediction.
    limitations: Not a crowd safety or causal-impact lesson.
    review_required: false
  recommender_base:
    name: Suggestle
    primary_lesson: recommender_intro
    confidence: high
    match_scope: task
    rationale: An accessible explanation of personalized filtering and why everyday services recommend items.
    limitations: No promise that recommendations understand a person's needs or interests perfectly.
    review_required: false
  recommender_product:
    name: Cartivore
    primary_lesson: recommender_types
    confidence: high
    match_scope: representative_technique
    rationale: Directly compares the canonical content-based and collaborative approaches used to suggest products.
    limitations: Not a two-tower implementation lesson.
    review_required: false
  recommender_content:
    name: Reelure
    primary_lesson: recommender_types
    confidence: high
    match_scope: representative_technique
    rationale: Content and collaborative filtering match Reelure's media recommendation role and expose cold-start and filter-bubble trade-offs.
    limitations: Does not teach the canonical sequence-model option.
    review_required: false
  recommender_ai_curator:
    name: Muselect
    primary_lesson: llm
    secondary_lesson: prompt_inspection
    secondary_rationale: Teaches changing prompts and comparing output behavior, directly supporting the canonical prompt-inspection explanation method.
    confidence: medium
    match_scope: representative_technique
    scope_label: Language-generation and prompt-inspection components, not a museum-curation system
    rationale: Explains the canonical LLM concept behind a language-driven AI curator.
    limitations: Not an art-curation tutorial or evidence for the Nasher project; its existing Signature provenance remains separate.
    review_required: true
  recommender_learning:
    name: Curriquill
    primary_lesson: recommender_types
    confidence: medium
    match_scope: representative_technique
    scope_label: Content-based learning-resource recommendation component, not knowledge tracing
    rationale: Content-based recommendation explains matching learning resources to a learner's stated interests and resource features.
    limitations: Does not teach knowledge tracing or prove learning gains; examples are not education-specific.
    review_required: true
  recommender_adaptive_learning:
    name: Mentamorph
    primary_lesson: llm
    confidence: medium
    match_scope: representative_technique
    scope_label: LLM feedback-generation component, not evidence of adaptive learning effectiveness
    rationale: Provides a foundation for the canonically listed LLM option in personalized learning guidance.
    limitations: Not an EcoJourneys lesson or evidence about its implementation, adaptation quality, or student outcomes.
    review_required: true
  recommender_research:
    name: Referaptor
    primary_lesson: similarity
    confidence: high
    match_scope: representative_technique
    rationale: Semantic embeddings and document similarity directly match finding research related to a passage or interest.
    limitations: Workbook explanation is not evidence of Keenious internals or any specific installed architecture.
    review_required: false
  recommender_menu:
    name: Nibblet
    primary_lesson: recommender_types
    confidence: high
    match_scope: representative_technique
    rationale: Content-based and collaborative preference matching directly explain recommendation options in the canonical menu role.
    limitations: Does not enforce allergies, dietary safety, or restaurant-specific constraints.
    review_required: false
  extractor_base:
    name: Scribbit
    primary_lesson: sequence_tagging
    confidence: medium
    match_scope: task
    scope_label: Named-entity sequence-tagging component illustrated with an RNN, not OCR
    rationale: The lesson explicitly pairs each word with an entity tag, illustrating how source text becomes structured entities, a canonical task for Scribbit.
    limitations: The RNN is the lesson's illustration, not a newly asserted canonical architecture. Does not teach scanning, handwriting, page layout, or a complete extraction pipeline.
    review_required: true
  extractor_medical:
    name: Clinink
    primary_lesson: transformer_practice
    confidence: medium
    match_scope: representative_technique
    scope_label: Encoder text-understanding component for NER, not clinical validation
    rationale: Teaches contextual encoder representations and explicitly identifies NER and information extraction as uses; transformers are already canonical for Clinink.
    limitations: Does not teach clinical ontologies, negation handling, protected health-data processing, or validated medical extraction. No particular clinical model is inferred.
    review_required: true
  extractor_government:
    name: Bureaucritter
    primary_lesson: transformer_practice
    confidence: medium
    match_scope: representative_technique
    scope_label: Transformer text-interpretation foundation, not spatial document layout or OCR
    rationale: A layout-aware transformer is explicitly canonical. The lesson teaches the underlying encoder representation and text-understanding component without claiming to teach the added document-layout machinery.
    limitations: Not a form-understanding tutorial; does not teach reading scans, spatial layout embeddings, field validation, or government-specific record requirements.
    review_required: true
  extractor_research:
    name: Scholarat
    primary_lesson: topics
    confidence: medium
    match_scope: representative_technique
    scope_label: Topic-discovery component, not every entity or relation extraction stage
    rationale: Topic modeling is explicitly canonical and the lesson explains deriving topics and keywords from document collections.
    limitations: Covers one part of Scholarat's role, not named-entity or relation extraction.
    review_required: true
  extractor_history:
    name: Archivole
    primary_lesson: topics
    secondary_lesson: provenance
    secondary_rationale: Adds source and transformation lineage, independently relevant when analyzing historical archives.
    confidence: medium
    match_scope: related_context
    scope_label: Illustrative document-theme analysis, not a documented redlining-project algorithm
    rationale: Finding themes in text collections offers related context for historical pattern analysis.
    limitations: Topic modeling is not asserted as the Friday Institute project's method; no redlining-specific lesson was found.
    review_required: true
  extractor_archive:
    name: Manusqueak
    primary_lesson: multimodal_inputs
    confidence: medium
    match_scope: input_representation
    scope_label: Vision-language input foundation, not handwriting recognition or transcription accuracy
    rationale: Vision-language models are explicitly canonical; the lesson explains how image and language inputs can be represented together for multimodal systems.
    limitations: A short foundational lesson, not an OCR or handwriting tutorial; does not establish that any archive uses a particular multimodal model.
    review_required: true
  extractor_specimen:
    name: Specimunk
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in handwriting recognition and OCR
    rationale: No lesson directly teaches handwritten specimen-label transcription or field extraction.
    limitations: Do not infer the museum project's undocumented OCR architecture from generic workbook material.
    candidate_lessons: []
    review_required: true
  scheduler_base:
    name: Plancton
    primary_lesson: rl
    confidence: medium
    match_scope: representative_technique
    scope_label: Reinforcement-learning decision component, not constraint programming or complete scheduling
    rationale: Reinforcement learning is explicitly canonical and the lesson explains choosing actions using rewards and policies.
    limitations: Only one possible technique; does not teach resource scheduling, linear programming, or constraints.
    review_required: true
  scheduler_hospital:
    name: Wardray
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in operational resource-allocation constraints
    rationale: No direct constraint-programming, mixed-integer, or hospital-resource scheduling lesson was found.
    limitations: Forecasting predicts demand but does not itself allocate beds, staff, or appointments.
    candidate_lessons: []
    review_required: true
  scheduler_transit:
    name: Routeopus
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in vehicle routing and dispatch constraints
    rationale: No direct routing or real-time transit scheduling lesson was found.
    limitations: ML training optimization and DAG orchestration do not explain vehicle scheduling.
    candidate_lessons: []
    review_required: true
  scheduler_transit_flow:
    name: Flowfin
    primary_lesson: time_features
    confidence: medium
    match_scope: input_representation
    scope_label: Temporal inputs to the predictive component, not transit-priority optimization
    rationale: Canon includes a predictive model using bus positions, schedules, and on-time performance; lagged values and rolling features explain meaningful temporal inputs to that component.
    limitations: Does not specify GoDurham's actual features, architecture, or controller. Forecasting inputs do not themselves allocate signal priority or prove travel-time benefits.
    review_required: true
  scheduler_ride_booking:
    name: Cabcrab
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in task-oriented dialogue and trip-booking state
    rationale: No lesson directly addresses conversational ride booking integrated with scheduling.
    limitations: Canon says conversational AI, not a specific LLM architecture; linking an LLM lesson as a direct model match would overstate support.
    candidate_lessons: [llm]
    review_required: true
  scheduler_traffic_signal:
    name: Signalquid
    primary_lesson: detection
    confidence: medium
    match_scope: task
    scope_label: Vehicle-detection perception component, not signal optimization or a documented installed detector
    rationale: Explains the object-location perception subtask that can support estimating traffic from images.
    limitations: Does not explain signal optimization or identify the Raleigh system's architecture, camera hardware, or installed detector.
    review_required: true
  scheduler_workforce:
    name: Shiftshark
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in worker-assignment and shift constraints
    rationale: No lesson teaches staff-assignment constraints, integer programming, or shift optimization.
    limitations: Demand forecasting is an input to, not a replacement for, workforce scheduling.
    candidate_lessons: []
    review_required: true
  scheduler_delivery:
    name: Parcelprawn
    primary_lesson: null
    confidence: low
    match_scope: unresolved
    scope_label: Genuine gap in delivery routing and time-window constraints
    rationale: No verified vehicle-routing, scheduling, or combinatorial-optimization lesson was found.
    limitations: Gradient descent for model training does not solve the routing problem represented here.
    candidate_lessons: []
    review_required: true
  generator_base:
    name: Purrrompt
    primary_lesson: generative
    confidence: high
    match_scope: task
    rationale: Accessible introduction to creating new outputs rather than only classifying existing observations.
    limitations: Introductory contrast, not an exhaustive guide to all canonical generative techniques.
    review_required: false
  generator_learning:
    name: Learnx
    primary_lesson: llm
    secondary_lesson: rag
